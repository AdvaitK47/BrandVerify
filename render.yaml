services:
  - type: web
    name: brandverify
    env: python
    plan: free
    region: oregon
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt
      pip install -r backend/requirements-advanced.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./brandverify.db
      - key: OPENAI_API_KEY
        sync: false
